<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>9 Dreams</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0807; /* Dark matching theme */
    }
    .container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    picture {
      width: 100%;
      height: 100%;
      display: block;
    }
    img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <picture>
      <!-- Mobile screen (vertical orientation / width <= 768px) -->
      <source media="(max-width: 768px)" srcset="mobile.png">
      <!-- Desktop screen (default) -->
      <img src="desktop.png" alt="9 Dreams">
    </picture>
  </div>
</body>
</html>
